<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>What Should Noiseredux Play?</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        :root {
            --ps-blue: #003087;
            --ps-blue-light: #0070cc;
            --nin-red: #e4000f;
            --bg: #f4f4f9;
            --text: #111118;
            --text-muted: #8888aa;
        }
        body { background-color: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; font-weight: 300; margin: 0; }
        .container { max-width: 1200px; margin: 0 auto; background: white; min-height: 100vh; box-shadow: 0 0 40px rgba(0,0,0,0.05); }
        header { background: linear-gradient(135deg, var(--ps-blue) 0%, #001a4d 100%); border-bottom: 4px solid var(--nin-red); padding: 1rem 1.5rem; text-align: center; }
        header h1 { font-family: 'Bebas Neue', sans-serif; font-size: clamp(1.6rem, 4.5vw, 2.4rem); color: #fff; line-height: 0.9; text-transform: uppercase; margin: 0; }
        .version-tag { font-size: 0.8rem; letter-spacing: 0.3em; text-transform: uppercase; color: #ffffff; opacity: 0.8; margin-top: 0.75rem; font-weight: 500; }
        .controls { background: #e2e2ea; padding: 8px 15px; display: flex; justify-content: center; align-items: center; gap: 15px; }
        .controls select { padding: 5px 16px; font-weight: 700; border: 2px solid var(--ps-blue); border-radius: 4px; color: var(--ps-blue); cursor: pointer; }
        .loading { text-align: center; padding: 80px; font-family: 'Bebas Neue', sans-serif; font-size: 2rem; color: var(--ps-blue); }
        .games-grid { display: flex; flex-direction: column; gap: 10px; padding: 15px 30px 30px; max-width: 900px; margin: 0 auto; }
        .game-card { background: white; border: 1px solid #dcdce8; border-radius: 8px; display: flex; align-items: center; padding: 10px 14px; gap: 16px; text-decoration: none; color: inherit; transition: all 0.2s ease; }
        .game-card.below-top5 { background: #ececf2; }
        .game-card:hover { transform: translateX(8px); border-color: var(--ps-blue-light); }
        .game-rank { font-family: 'Bebas Neue', sans-serif; font-size: 1.9rem; color: var(--ps-blue); min-width: 55px; text-align: center; }
        .game-image-container { width: 56px; height: 75px; background: #eee; border-radius: 4px; overflow: hidden; flex-shrink: 0; }
        .game-image { width: 100%; height: 100%; object-fit: cover; }
        .game-title { font-weight: 700; font-size: 1.08rem; color: var(--text); line-height: 1.2; }
        .platform-tag { background: #edf2f7; color: #4a5568; font-size: 0.63rem; padding: 2px 7px; border-radius: 4px; margin-right: 4px; text-transform: uppercase; font-weight: 700; border: 1px solid #cbd5e0; }
        footer { padding: 50px; text-align: center; color: var(--text-muted); font-size: 0.8rem; border-top: 1px solid #e2e2ea; }

        /* Phone-only: rows were tiny on iPhone (non-Pro) — roughly 16
           visible at once. Scaled up ~1.33x here to land closer to 12
           visible. Scoped to this breakpoint only so desktop (tuned to show
           exactly 5 top cards on a MacBook Neo) is unaffected. */
        @media (max-width: 600px) {
            .games-grid { gap: 14px; }
            .game-card { padding: 14px 18px; gap: 21px; }
            .game-rank { font-size: 2.5rem; min-width: 74px; }
            .game-image-container { width: 75px; height: 100px; }
            .game-title { font-size: 1.44rem; }
            .platform-tag { font-size: 0.84rem; padding: 3px 9px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>What Should Noiseredux Play?</h1>
        </header>
        <div class="controls">
            <label>Select Year:</label>
            <select id="yearSelect"></select>
        </div>
        <div id="content"></div>
        <footer>
            Built by noiseredux &nbsp;·&nbsp; Data sourced from an IGDB List, exported to CSV <br>
            A personal want-to-play index for Sony, Nintendo, and Apple collectors — through the lens of a lifelong fanboy.
        </footer>
    </div>

    <script>
        // --- CONFIG -----------------------------------------------------
        // Must be the raw.githubusercontent.com URL, not a github.com/.../blob/
        // page — the blob page serves HTML with no CORS headers, so fetch()
        // will fail with an "Access-Control-Allow-Origin" error like the one
        // above.
        const CSV_URL = 'https://raw.githubusercontent.com/noiseredux/whatshouldnoisereduxplay/main/want-to-play.csv';

        const COVER_ART_URL = 'https://script.google.com/macros/s/AKfycbyUhqm3gLlqzSrK-tfxB-uHfTbUBfUwYiHxLmMJqeBPiADBHta1Eg2QUi-1UPtpZkrD/exec';

        const COVER_CACHE_KEY = 'noiseredux_cover_cache_v1';
        const COVER_BATCH_SIZE = 100; // keep query-string length safely small per request

        // Preferred-platform whitelist, matched against the CSV's platform
        // *name* strings (the CSV has no numeric IGDB platform IDs to match
        // on directly). Rules are checked in order, first match wins — more
        // specific names (e.g. "Super Nintendo") are listed before generic
        // ones (e.g. plain "Nintendo") so they don't get misclassified.
        // Any platform not matched here is simply not shown.
        const PLATFORM_RULES = [
            { abbr: 'A2', keywords: ['apple ii'] },
            { abbr: 'Mac', keywords: ['mac'] },
            { abbr: 'LNX', keywords: ['linux'] },
            { abbr: 'iOS', keywords: ['ios'] },
            { abbr: 'STM', keywords: ['pc (microsoft windows)', 'microsoft windows'] },
            { abbr: 'SNES', keywords: ['super nintendo', 'snes'] },
            { abbr: 'NES', keywords: ['nintendo entertainment system', 'nes'] },
            { abbr: 'SFC', keywords: ['super famicom', 'sfc'] },
            { abbr: 'FC', keywords: ['famicom', 'family computer'] },
            { abbr: 'N64', keywords: ['nintendo 64'] },
            { abbr: 'GC', keywords: ['gamecube'] },
            { abbr: 'WiiU', keywords: ['wii u'] },
            { abbr: 'Wii', keywords: ['wii'] },
            { abbr: 'NS2', keywords: ['switch 2'] },
            { abbr: 'NS', keywords: ['nintendo switch'] },
            { abbr: 'GBC', keywords: ['game boy color'] },
            { abbr: 'GBA', keywords: ['game boy advance'] },
            { abbr: 'GB', keywords: ['game boy'] },
            { abbr: '3DS', keywords: ['3ds'] },
            { abbr: 'DS', keywords: ['nintendo ds'] },
            { abbr: 'MSX2', keywords: ['msx2'] },
            { abbr: 'MSX', keywords: ['msx'] },
            { abbr: '2600', keywords: ['2600'] },
            { abbr: 'CV', keywords: ['colecovision'] },
            { abbr: 'CDi', keywords: ['cd-i', 'cdi'] },
            { abbr: 'SCD', keywords: ['sega cd', 'mega-cd', 'mega cd'] },
            { abbr: 'WSC', keywords: ['wonderswan color'] },
            { abbr: 'WS', keywords: ['wonderswan'] },
            { abbr: 'VB', keywords: ['virtual boy'] },
            { abbr: 'PS5', keywords: ['playstation 5'] },
            { abbr: 'PS4', keywords: ['playstation 4'] },
            { abbr: 'PS3', keywords: ['playstation 3'] },
            { abbr: 'PS2', keywords: ['playstation 2'] },
            { abbr: 'PSVR', keywords: ['playstation vr'] },
            { abbr: 'PSP', keywords: ['playstation portable'] },
            { abbr: 'PSV', keywords: ['playstation vita'] },
            { abbr: 'PS1', keywords: ['playstation'] },
            { abbr: 'FDS', keywords: ['disk system'] },
            { abbr: 'X68k', keywords: ['x68000'] },
            { abbr: 'X1', keywords: ['sharp x1'] },
            { abbr: 'SV', keywords: ['supervision'] },
            { abbr: 'TGCD', keywords: ['turbografx-cd', 'turbografx cd', 'pc engine cd'] },
            { abbr: 'TG16', keywords: ['turbografx', 'pc engine'] },
            { abbr: 'SG', keywords: ['sg-1000', 'sg1000'] },
            { abbr: '32X', keywords: ['32x'] },
            { abbr: 'SMS', keywords: ['master system'] },
            { abbr: 'GG', keywords: ['game gear'] }
        ];

        // --- HELPERS ------------------------------------------------------
        // Returns the preferred abbreviation for a platform name, or null if
        // it's not on the whitelist (in which case it won't be shown at all).
        function getPlatformAbbr(name) {
            if (!name) return null;
            const lower = name.toLowerCase();
            for (const rule of PLATFORM_RULES) {
                if (rule.keywords.some(k => lower.includes(k))) return rule.abbr;
            }
            return null;
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str == null ? '' : str;
            return div.innerHTML;
        }

        // The IGDB export stores these columns as JSON-array-looking strings,
        // e.g. ["Nintendo Switch 2"] or ["Jul 23, 2026 (Worldwide [WW])"].
        // Parse defensively since blank cells aren't valid JSON.
        function parseJsonArrayField(raw) {
            if (!raw) return [];
            try {
                const parsed = JSON.parse(raw);
                return Array.isArray(parsed) ? parsed : [];
            } catch (e) {
                return [];
            }
        }

        // We only care about the year, not the month/day, and a game can list
        // several regional release dates. Pull every 4-digit year out of the
        // field and use the earliest one.
        function extractEarliestYear(releaseDateField) {
            const dates = parseJsonArrayField(releaseDateField);
            const text = dates.length ? dates.join(' ') : (releaseDateField || '');
            const matches = text.match(/\b(19|20)\d{2}\b/g);
            if (!matches) return null;
            return Math.min(...matches.map(Number));
        }

        // Turns one release-date entry (e.g. "Sep 18, 2024 (Worldwide [WW])",
        // "Dec 2004", "2026", "Q4 2026", "TBD") into:
        //   start   - timestamp used for sorting
        //   end     - timestamp of the first moment AFTER the period it covers
        //             (used to decide whether the game is actually out yet)
        //   precise - true only if it names an exact day
        // Returns null for entries with no usable date (e.g. "TBD").
        function parseDateEntry(entry) {
            const text = String(entry).replace(/\s*\(.*\)\s*$/, '').trim();

            let m = text.match(/^Q([1-4])\s+(\d{4})$/i);
            if (m) {
                const q = parseInt(m[1], 10), y = parseInt(m[2], 10);
                return { start: new Date(y, (q - 1) * 3, 1).getTime(), end: new Date(y, q * 3, 1).getTime(), precise: false };
            }

            m = text.match(/^(\d{4})$/);
            if (m) {
                const y = parseInt(m[1], 10);
                return { start: new Date(y, 0, 1).getTime(), end: new Date(y + 1, 0, 1).getTime(), precise: false };
            }

            m = text.match(/^([A-Za-z]{3,9})\s+(\d{4})$/);
            if (m) {
                const t = Date.parse(`${m[1]} 1, ${m[2]}`);
                if (isNaN(t)) return null;
                const d = new Date(t);
                return { start: t, end: new Date(d.getFullYear(), d.getMonth() + 1, 1).getTime(), precise: false };
            }

            const t = Date.parse(text);
            if (isNaN(t)) return null;
            const d = new Date(t);
            return { start: t, end: new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1).getTime(), precise: true };
        }

        // Picks the release date used for sorting and for the "is it out yet"
        // check.
        //  1. Only dates inside the game's assigned year are considered, so a
        //     later port/remaster (e.g. a 2026 PC release of a 2019 game) can't
        //     drag the game out of its own year or make it look unreleased.
        //  2. IGDB repeats a date once per platform/region, so the date that
        //     appears most often wins.
        //  3. On a tie, we check whether the game's dates are revisions or
        //     staggered launches. Entries are grouped by region label; if any
        //     one region has more entries than the game has platforms, a
        //     platform must carry several dates for that same region, which
        //     means old estimates/betas that were revised (Call of Duty:
        //     Modern Warfare 4, Black Ops 7). The LATEST tied date is the
        //     current one. Otherwise the dates are separate regional or
        //     per-platform launches (Agefield High, Zelda: Spirit Tracks),
        //     and the EARLIEST tied date wins: it's when the game first
        //     became playable.
        // Exact-day dates are preferred; vaguer entries (month/quarter/year
        // only) are only used when no exact-day date exists in that year.
        // Returns { start, end } or null.
        function pickReleaseDate(releaseDateField, platformCount, year) {
            const parsed = parseJsonArrayField(releaseDateField)
                .map(e => {
                    const p = parseDateEntry(e);
                    if (p) {
                        const m = String(e).match(/\(([^)]*)\)\s*$/);
                        p.region = m ? m[1].trim() : '';
                    }
                    return p;
                })
                .filter(p => p && new Date(p.start).getFullYear() === year);
            if (!parsed.length) return null;

            const precise = parsed.filter(p => p.precise);
            const pool = precise.length ? precise : parsed;

            const counts = new Map(); // start timestamp -> { count, entry }
            pool.forEach(p => {
                const hit = counts.get(p.start);
                if (hit) hit.count++;
                else counts.set(p.start, { count: 1, entry: p });
            });

            const perRegion = {};
            pool.forEach(p => { perRegion[p.region] = (perRegion[p.region] || 0) + 1; });
            const preferLatest = Math.max(...Object.values(perRegion)) > platformCount;
            let best = null;
            counts.forEach(v => {
                if (!best || v.count > best.count) { best = v; return; }
                if (v.count === best.count) {
                    const later = v.entry.start > best.entry.start;
                    if (preferLatest ? later : !later) best = v;
                }
            });
            return { start: best.entry.start, end: best.entry.end, precise: best.entry.precise };
        }

        // --- COVER ART -------------------------------------------------------
        // Cache shape in localStorage: { "348977": "abc123", ... } mapping
        // IGDB game ID -> IGDB cover image_id. Covers essentially never change
        // for a given game, so once fetched they're kept indefinitely and only
        // re-requested for IDs the cache hasn't seen before.
        function loadCoverCache() {
            try {
                const raw = localStorage.getItem(COVER_CACHE_KEY);
                return raw ? JSON.parse(raw) : {};
            } catch (e) {
                return {};
            }
        }

        function saveCoverCache(cache) {
            try {
                localStorage.setItem(COVER_CACHE_KEY, JSON.stringify(cache));
            } catch (e) {
                // localStorage full or unavailable — non-fatal, covers just
                // won't persist between visits.
                console.warn('Could not save cover cache:', e);
            }
        }

        // Fetches covers for any game IDs not already in the cache, in
        // batches, and merges the results back into (and returns) the cache.
        async function fetchMissingCovers(allIds, cache) {
            const missing = [...new Set(allIds)].filter(id => id != null && !(id in cache));
            if (!missing.length) return cache;

            for (let i = 0; i < missing.length; i += COVER_BATCH_SIZE) {
                const batch = missing.slice(i, i + COVER_BATCH_SIZE);
                try {
                    const response = await fetch(`${COVER_ART_URL}?ids=${batch.join(',')}`);
                    const data = await response.json();
                    if (data && data.covers) {
                        Object.assign(cache, data.covers);
                    }
                } catch (e) {
                    console.warn('Cover art batch failed:', e);
                    // Continue with remaining batches even if one fails.
                }
            }

            saveCoverCache(cache);
            return cache;
        }

        // Sorts every year's game list in place: newest release first,
        // oldest last. Games with no parseable date go to the bottom.
        function sortAllYears() {
            const gamesByYear = window.__gamesByYear || {};
            Object.keys(gamesByYear).forEach(year => {
                gamesByYear[year].sort((a, b) => {
                    if (a.releaseDate === null && b.releaseDate === null) return 0;
                    if (a.releaseDate === null) return 1;
                    if (b.releaseDate === null) return -1;
                    return b.releaseDate - a.releaseDate;
                });
            });
        }

        // --- LOAD + PARSE ---------------------------------------------------
        async function loadGames() {
            const content = document.getElementById('content');
            content.innerHTML = '<div class="loading">Loading Index...</div>';
            try {
                const response = await fetch(`${CSV_URL}?_cb=${Date.now()}`);
                if (!response.ok) throw new Error(`Fetch failed: ${response.status}`);
                const csvText = await response.text();
                const parsed = Papa.parse(csvText, { header: true, skipEmptyLines: true });

                const gamesByYear = {};
                const now = Date.now();

                parsed.data.forEach(row => {
                    const year = extractEarliestYear(row.release_date);
                    if (!year) return;

                    const picked = pickReleaseDate(row.release_date, parseJsonArrayField(row.platforms).length, year);

                    // Hide anything not yet released. Exact-day dates appear
                    // on the day of release; month/quarter/year-only dates
                    // appear once that whole period has passed.
                    if (!picked || (picked.precise ? picked.start : picked.end) > now) return;

                    const gameId = row.id ? parseInt(row.id, 10) : null;

                    const game = {
                        id: (gameId !== null && !isNaN(gameId)) ? gameId : null,
                        name: row.game,
                        url: row.url,
                        releaseDate: picked.start,
                        platforms: parseJsonArrayField(row.platforms)
                    };

                    if (!gamesByYear[year]) gamesByYear[year] = [];
                    gamesByYear[year].push(game);
                });

                window.__gamesByYear = gamesByYear;
                sortAllYears();
                populateYearDropdown(Object.keys(gamesByYear).map(Number));

                const select = document.getElementById('yearSelect');

                // Render immediately without covers so the list appears fast...
                displayGames(gamesByYear[select.value] || []);

                // ...then fetch any missing covers and re-render once they're in.
                const allIds = Object.values(gamesByYear).flat().map(g => g.id);
                window.__coverCache = await fetchMissingCovers(allIds, loadCoverCache());
                displayGames(gamesByYear[select.value] || []);

            } catch (e) {
                console.error(e);
                content.innerHTML = `<div class="loading" style="color:red">System Connection Error.</div>`;
            }
        }

        function populateYearDropdown(years) {
            const select = document.getElementById('yearSelect');
            select.innerHTML = '';
            years.sort((a, b) => b - a);
            years.forEach(year => {
                const opt = document.createElement('option');
                opt.value = year; opt.textContent = year;
                select.appendChild(opt);
            });
        }

        function displayGames(gamesList) {
            const content = document.getElementById('content');

            if (!gamesList.length) {
                content.innerHTML = '<div class="loading">No records found for this year.</div>';
                return;
            }

            const grid = document.createElement('div');
            grid.className = 'games-grid';

            const coverCache = window.__coverCache || {};

            gamesList.forEach((game, index) => {
                const card = document.createElement('a');
                card.className = 'game-card' + (index >= 12 ? ' below-top5' : '');
                card.href = game.url || '#';
                card.target = '_blank';
                const imageId = game.id != null ? coverCache[game.id] : null;
                const coverUrl = imageId ? `https://images.igdb.com/igdb/image/upload/t_cover_small/${imageId}.jpg` : '';
                card.innerHTML = `
                    <div class="game-rank">#${index + 1}</div>
                    <div class="game-image-container">${coverUrl ? `<img class="game-image" src="${coverUrl}" alt="${escapeHtml(game.name)} cover">` : ''}</div>
                    <div class="game-info">
                        <div class="game-title">${escapeHtml(game.name)}</div>
                        <div style="margin-top: 6px;">
                            ${game.platforms.map(p => getPlatformAbbr(p)).filter(Boolean).map(abbr => `<span class="platform-tag">${escapeHtml(abbr)}</span>`).join('')}
                        </div>
                    </div>`;
                grid.appendChild(card);
            });

            content.innerHTML = '';
            content.appendChild(grid);
        }

        document.getElementById('yearSelect').addEventListener('change', e => {
            displayGames(window.__gamesByYear[e.target.value] || []);
        });

        loadGames();
    </script>
</body>
</html>
