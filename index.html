<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>What Should Noiseredux Play?</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet" />
    <style>
        :root {
            --ps-blue: #003087;
            --ps-blue-light: #0070cc;
            --nin-red: #e4000f;
            --bg: #f4f4f9;
            --text: #111118;
            --text-muted: #8888aa;
        }
        body { background-color: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; font-weight: 300; margin: 0; }
        .container { max-width: 1200px; margin: 0 auto; background: white; min-height: 100vh; box-shadow: 0 0 40px rgba(0,0,0,0.05); }
        header { background: linear-gradient(135deg, var(--ps-blue) 0%, #001a4d 100%); border-bottom: 4px solid var(--nin-red); padding: 3rem 1.5rem; text-align: center; }
        header h1 { font-family: 'Bebas Neue', sans-serif; font-size: clamp(2.2rem, 7vw, 4.2rem); color: #fff; line-height: 0.9; text-transform: uppercase; margin: 0; }
        .version-tag { font-size: 0.8rem; letter-spacing: 0.3em; text-transform: uppercase; color: #ffffff; opacity: 0.8; margin-top: 0.75rem; font-weight: 500; }
        .controls { background: #e2e2ea; padding: 15px; display: flex; justify-content: center; align-items: center; gap: 15px; }
        .controls select { padding: 8px 20px; font-weight: 700; border: 2px solid var(--ps-blue); border-radius: 4px; color: var(--ps-blue); cursor: pointer; }
        .loading { text-align: center; padding: 80px; font-family: 'Bebas Neue', sans-serif; font-size: 2rem; color: var(--ps-blue); }
        .games-grid { display: flex; flex-direction: column; gap: 12px; padding: 30px; max-width: 900px; margin: 0 auto; }
        .game-card { background: white; border: 1px solid #dcdce8; border-radius: 8px; display: flex; align-items: center; padding: 14px; gap: 20px; text-decoration: none; color: inherit; transition: all 0.2s ease; }
        .game-card:hover { transform: translateX(8px); border-color: var(--ps-blue-light); }
        .game-rank { font-family: 'Bebas Neue', sans-serif; font-size: 2.2rem; color: var(--ps-blue); min-width: 65px; text-align: center; }
        .game-image-container { width: 70px; height: 94px; background: #eee; border-radius: 4px; overflow: hidden; flex-shrink: 0; }
        .game-image { width: 100%; height: 100%; object-fit: cover; }
        .game-title { font-weight: 700; font-size: 1.2rem; color: var(--text); }
        .engagement-value { color: var(--nin-red); font-weight: 700; }
        .platform-tag { background: #edf2f7; color: #4a5568; font-size: 0.65rem; padding: 3px 8px; border-radius: 4px; margin-right: 5px; text-transform: uppercase; font-weight: 700; border: 1px solid #cbd5e0; }
        footer { padding: 50px; text-align: center; color: var(--text-muted); font-size: 0.8rem; border-top: 1px solid #e2e2ea; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>What Should Noiseredux Play?</h1>
        </header>
        <div class="controls">
            <label>Select Year:</label>
            <select id="yearSelect"></select>
        </div>
        <div id="content"></div>
        <footer>
            Built by noiseredux &nbsp;·&nbsp; Data powered by IGDB
        </footer>
    </div>

    <script>
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwdEO6cjjiA_Xr4pmkdb9m2wENhSUBd9rdekTHZw_MHRu7Xu5V6ry74rmTKe-I9KXz0/exec';

        // --- v18.0.0: CONFIDENCE-WEIGHTED SCORE BUILD ---
        // Builds on v17's "pure totalRating" ranking, but fixes the "1
        // review sitting at #1" problem by weighting each game's rating
        // against how many reviews it has RELATIVE TO the most-reviewed
        // game that year, rather than ranking raw scores unweighted:
        //
        //   confidence = reviews / maxReviewsThisYear   (1.0 = the year's
        //                                                 most-reviewed game)
        //   weighted   = confidence * totalRating
        //              + (1 - confidence) * C
        //
        //   C = mean totalRating across this year's rated games (the
        //       fallback a low-confidence game gets pulled toward)
        //
        // The year's most-reviewed game keeps its score exactly as-is
        // (confidence = 1, no pull toward the mean at all). A game with
        // very few reviews compared to that year's ceiling gets pulled
        // hard toward the year's average instead of trusting its own
        // (statistically shaky) rating. No engagement fields (follows/
        // ratingCount/hypes) are used anywhere in this build.
        const WINDOWS_PLATFORM_ID = 6;

        function isConfirmedSteamTitle(game) {
            return !!game.steamAppId;
        }

        const ALLOWED_PLATFORMS = [75, 14, 39, 18, 99, 19, 58, 4, 21, 5, 41, 130, 508, 33, 22, 24, 20, 37, 27, 53, 59, 68, 117, 78, 57, 123, 87, 7, 8, 9, 48, 167, 165, 38, 46, 51, 77, 121, 306, 86, 150, 29, 30, 64, 35, 3];
        const PLATFORM_NAMES = { 75: 'A2', 14: 'Mac', 39: 'iOS', 18: 'NES', 99: 'FC', 19: 'SNES', 58: 'SFC', 4: 'N64', 21: 'GC', 5: 'Wii', 41: 'WiiU', 130: 'NS', 508: 'NS2', 33: 'GB', 22: 'GBC', 24: 'GBA', 20: 'DS', 37: '3DS', 27: 'MSX', 53: 'MSX2', 59: '2600', 68: 'CV', 117: 'CDi', 78: 'SCD', 57: 'WS', 123: 'WSC', 87: 'VB', 7: 'PS1', 8: 'PS2', 9: 'PS3', 48: 'PS4', 167: 'PS5', 165: 'PSVR', 38: 'PSP', 46: 'PSV', 51: 'FDS', 77: 'X1', 121: 'X68k', 306: 'SV', 86: 'TG16', 150: 'TGCD', 29: 'SG', 30: '32X', 64: 'SMS', 35: 'GG', 3: 'LNX', 6: 'STM' };

        // IGDB Category Blacklist: 1=DLC, 2=Expansion, 3=Bundle, 4=Standalone Expansion, 5=Mod, 6=Episode, 7=Season
        const BLACKLISTED_CATEGORIES = [1, 2, 3, 4, 5, 6, 7];

        function populateYearDropdown() {
            const select = document.getElementById('yearSelect');
            for (let year = 2026; year >= 1977; year--) {
                const opt = document.createElement('option');
                opt.value = year; opt.textContent = year;
                select.appendChild(opt);
            }
        }

        // Computes this year's ceiling (max reviews) and prior mean rating
        // (C), across all eligible (rated) games.
        function computeYearStats(games) {
            if (!games.length) return { C: 0, maxReviews: 0 };
            const C = games.reduce((sum, g) => sum + g.totalRating, 0) / games.length;
            const maxReviews = games.reduce((max, g) => Math.max(max, g.reviews || 0), 0);
            return { C, maxReviews };
        }

        function displayGames(gamesList) {
            const content = document.getElementById('content');

            let filtered = gamesList.filter(game => {
                const isCorrectPlatform = game.platforms.some(id => ALLOWED_PLATFORMS.includes(id)) || isConfirmedSteamTitle(game);
                const isBlacklistedCategory = game.category && BLACKLISTED_CATEGORIES.includes(game.category);
                return isCorrectPlatform && !isBlacklistedCategory;
            });

            // Only games with an actual IGDB total_rating can be ranked.
            filtered = filtered.filter(game => (game.totalRating || 0) > 0);

            if (!filtered.length) {
                content.innerHTML = '<div class="loading">No rated records found for this year.</div>';
                return;
            }

            const { C, maxReviews } = computeYearStats(filtered);

            filtered.forEach(game => {
                const v = game.reviews || 0;
                const confidence = maxReviews > 0 ? Math.min(v / maxReviews, 1) : 0;
                game.confidence = confidence;
                game.hype_score = Math.round((confidence * game.totalRating) + ((1 - confidence) * C));
            });

            filtered.sort((a, b) => b.hype_score - a.hype_score);

            const grid = document.createElement('div');
            grid.className = 'games-grid';

            filtered.forEach((game, index) => {
                const card = document.createElement('a');
                card.className = 'game-card';
                card.href = `https://www.igdb.com/games/${game.slug}`;
                card.target = '_blank';
                const coverUrl = game.cover ? `https://images.igdb.com/igdb/image/upload/t_cover_small/${game.cover}.jpg` : '';
                card.innerHTML = `
                    <div class="game-rank">#${index + 1}</div>
                    <div class="game-image-container">${game.cover ? `<img class="game-image" src="${coverUrl}" alt="${game.name} cover">` : ''}</div>
                    <div class="game-info">
                        <div class="game-title">${game.name}</div>
                        <div style="font-size:0.85rem; color:var(--text-muted); text-transform:uppercase;">
                            Score: <span class="engagement-value">${game.hype_score}</span>
                        </div>
                        <div style="margin-top: 4px;">
                            ${game.platforms.filter(id => ALLOWED_PLATFORMS.includes(id)).map(id => `<span class="platform-tag">${PLATFORM_NAMES[id] || id}</span>`).join('')}${isConfirmedSteamTitle(game) ? `<span class="platform-tag">${PLATFORM_NAMES[WINDOWS_PLATFORM_ID]}</span>` : ''}
                        </div>
                    </div>`;
                grid.appendChild(card);
            });

            content.innerHTML = '';
            content.appendChild(grid);
        }

        async function fetchGames(year) {
            const response = await fetch(`${GOOGLE_SCRIPT_URL}?year=${year}&_cb=${Date.now()}`);
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }
            const text = await response.text();
            try {
                return JSON.parse(text);
            } catch (parseErr) {
                throw new Error('Non-JSON response from backend');
            }
        }

        async function loadGames(year) {
            const content = document.getElementById('content');
            content.innerHTML = '<div class="loading">Loading Index...</div>';
            try {
                const data = await fetchGames(year);
                displayGames(data.games || []);
            } catch (firstErr) {
                // One retry on a transient failure (bad JSON, timeout, etc.)
                // before showing the user an error.
                try {
                    const data = await fetchGames(year);
                    displayGames(data.games || []);
                } catch (secondErr) {
                    console.error(firstErr, secondErr);
                    content.innerHTML = `<div class="loading" style="color:red">System Connection Error.</div>`;
                }
            }
        }

        populateYearDropdown();
        document.getElementById('yearSelect').addEventListener('change', e => loadGames(e.target.value));
        loadGames(2026);
    </script>
</body>
</html>
